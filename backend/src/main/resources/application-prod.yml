spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Free-tier MySQL (PlanetScale / Render) caps at 5-10 connections; keep pool lean
      maximum-pool-size: 5
      minimum-idle: 2
      # Fail fast if no connection is available rather than hanging
      connection-timeout: 10000
      idle-timeout: 120000
      max-lifetime: 600000
      # Keep connections warm — avoids TCP re-handshake latency on every auth call
      keepalive-time: 30000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
        query:
          in_clause_parameter_padding: true
          # Cache compiled JPQL query plans (auth query re-used every login/register)
          plan_cache_max_size: 2048
          plan_parameter_metadata_max_size: 128

  # ── Caffeine-backed Spring Cache ─────────────────────────────────────────────
  # Caffeine is the fastest JVM in-process cache (O(1), window-TinyLFU eviction).
  # No network, no serialisation overhead — sub-microsecond read latency.
  cache:
    type: caffeine
    caffeine:
      # Default spec — any cache without a specific CaffeineSpec bean
      spec: maximumSize=500,expireAfterWrite=300s
    cache-names:
      - publicJobs       # paginated job search — 5 min TTL
      - jobsBySlug       # job detail page — 5 min TTL (high read, low write)
      - featuredJobs     # landing page featured — 5 min TTL
      - categoryCounts   # category counts — 5 min TTL
      - relatedJobs      # related jobs sidebar — 5 min TTL
      - companiesSearch  # company autocomplete — 5 min TTL

server:
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
