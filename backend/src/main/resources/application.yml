spring:
  application:
    name: job-platform-backend
  profiles:
    active: dev
  cache:
    type: simple
    cache-names:
      - publicJobs
      - jobsBySlug
      - featuredJobs
      - relatedJobs
      - categoryCounts
      - companiesSearch
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:4c9b31d4e78a63581f92e4a8b75319c5a1728e209d84bf273e89a35d8a0c2174}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:job-platform/company-logos}
